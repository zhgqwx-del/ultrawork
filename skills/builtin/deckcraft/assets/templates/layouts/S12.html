<!-- S12 三栏卡片（dense）：页题 + 三张并列卡片（各带编号、栏头、2-3 条要点） -->
<section class="slide" data-layout="S12" data-rhythm="dense">
  <h1>页标题</h1>
  <div style="display:flex;gap:32px;margin-top:48px;min-height:400px">
    <div style="flex:1;background:var(--c-bg2);padding:32px;border-radius:var(--radius)">
      <div class="num" style="font-size:var(--fs-h2);color:var(--c-accent)">01</div>
      <h3 style="color:var(--c-head);margin-top:16px">栏头</h3>
      <ul style="margin-top:16px;display:flex;flex-direction:column;gap:8px"><li style="font-size:var(--fs-caption);color:var(--c-muted)">要点</li></ul>
    </div>
  </div>
</section>
