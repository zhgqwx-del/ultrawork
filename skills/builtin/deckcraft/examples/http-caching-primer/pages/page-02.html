<section class="slide" data-layout="S03" data-rhythm="dense">
  <div style="display:flex;height:100%;gap:64px">
    <div style="width:360px;flex-shrink:0;display:flex;flex-direction:column">
      <div style="width:48px;height:8px;background:var(--c-accent)"></div>
      <h1 style="margin-top:24px">四个关键<br>缓存指令</h1>
      <p style="margin-top:24px;color:var(--c-muted);font-size:var(--fs-caption);letter-spacing:.08em">存储 · 复用 · 验证 · 共享</p>
    </div>
    <ul style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px">
      <li style="display:flex;gap:24px;align-items:baseline">
        <span style="font-size:var(--fs-caption);font-weight:500;color:var(--c-muted);width:32px;flex-shrink:0">01</span>
        <div>
          <h3 style="font-weight:700;color:var(--c-primary)">max-age</h3>
          <p style="margin-top:8px;color:var(--c-muted)">响应在指定秒数内视为新鲜，缓存直接复用不回源</p>
        </div>
      </li>
      <li style="display:flex;gap:24px;align-items:baseline">
        <span style="font-size:var(--fs-caption);font-weight:500;color:var(--c-muted);width:32px;flex-shrink:0">02</span>
        <div>
          <h3 style="font-weight:700;color:var(--c-primary)">no-store</h3>
          <p style="margin-top:8px;color:var(--c-muted)">完全不存储任何副本，用于敏感或永不复用的内容</p>
        </div>
      </li>
      <li style="display:flex;gap:24px;align-items:baseline">
        <span style="font-size:var(--fs-caption);font-weight:500;color:var(--c-muted);width:32px;flex-shrink:0">03</span>
        <div>
          <h3 style="font-weight:700;color:var(--c-primary)">no-cache</h3>
          <p style="margin-top:8px;color:var(--c-muted)">允许存储，但每次复用前必须回源重新验证</p>
        </div>
      </li>
      <li style="display:flex;gap:24px;align-items:baseline">
        <span style="font-size:var(--fs-caption);font-weight:500;color:var(--c-muted);width:32px;flex-shrink:0">04</span>
        <div>
          <h3 style="font-weight:700;color:var(--c-primary)">s-maxage</h3>
          <p style="margin-top:8px;color:var(--c-muted)">只对 CDN 等共享缓存生效，并覆盖 <span style="color:var(--c-accent);font-weight:700">max-age</span></p>
        </div>
      </li>
    </ul>
  </div>
  <div class="pagenum">2 / 7</div>
</section>
