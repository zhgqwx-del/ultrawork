<!-- S14 流程链（dense）：页题 + 3-5 步骤方块，箭头用 › 字符（不画 SVG，避免 pptx 栅格化） -->
<section class="slide" data-layout="S14" data-rhythm="dense">
  <h1>页标题</h1>
  <div style="display:flex;align-items:stretch;gap:16px;margin-top:64px">
    <div style="flex:1;background:var(--c-bg2);padding:32px;border-top:calc(var(--rule-w) * 4) solid var(--c-accent);border-radius:var(--radius)">
      <div class="kicker">STEP 1</div>
      <h3 style="color:var(--c-head);margin-top:16px">步骤名</h3>
      <p style="margin-top:8px;color:var(--c-muted);font-size:var(--fs-caption)">一句说明</p>
    </div>
    <div style="display:flex;align-items:center;color:var(--c-muted);font-size:var(--fs-h2)">›</div>
  </div>
</section>
