name: Release

# Tag-triggered installer builds for all platforms. Produces the native
# installers (macOS .dmg, Windows .msi/.exe, Linux .deb/.rpm/.AppImage) and
# uploads each edition/platform separately. Version tags build Ultrawork and
# MyWork, then publish one Release only after all six jobs and manifest checks
# pass. Tag releases require Developer ID signing and notarization on macOS;
# ALLOW_UNSIGNED_RELEASE applies only to manual artifact-only verification.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      brand:
        description: Brand preset to build (tags always build both editions)
        type: choice
        options: [all, default, mywork]
        default: all

jobs:
  # Guard: on a version tag (v*), the tag MUST match the version baked into the
  # installer (tauri.conf.json). Nothing else in this workflow derives the
  # version from the tag — the installer and the About page read tauri.conf.json
  # / app-version.ts, which check-docs.ts keeps mutually equal. So a tag that
  # disagrees with those files would silently ship an installer whose internal
  # version differs from the Release page title. Fail fast here, before the
  # expensive cross-platform build. workflow_dispatch runs carry no tag → skip.
  guard:
    name: guard (tag == file version)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Verify tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(jq -r '.version' packages/client/desktop/src-tauri/tauri.conf.json)"
          echo "tag version:  $tag"
          echo "file version: $file"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match tauri.conf.json version '$file'." \
                 "Bump all five version files (root/desktop package.json, tauri.conf.json," \
                 "Cargo.toml, app-version.ts) to match the tag, or retag. See check-docs.ts §2f."
            exit 1
          fi
      - name: Plan edition/platform matrix
        id: matrix
        env:
          ULTRAWORK_RELEASE_BRAND_INPUT: ${{ inputs.brand || 'all' }}
        run: |
          matrix="$(bun run --bun scripts/release-ci.ts --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.brand }} / ${{ matrix.name }})
    needs: guard
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      ULTRAWORK_RELEASE_BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@stable

      # macOS builds a Universal binary (universal-apple-darwin) → needs the
      # x86_64 target too (runner host is arm64).
      - name: Add x86_64 macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libfuse2 rpm

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run --bun scripts/vendor-dependencies.ts

      # Import the Developer ID Application cert into a throwaway keychain so
      # `codesign` (invoked by `bun run release` → tauri) can find the signing
      # identity. Without this, APPLE_SIGNING_IDENTITY names an identity that
      # isn't in any keychain on the fresh runner and signing fails. No-op when the
      # secret is absent — and then the build step below FAILS the release rather
      # than falling back to unsigned (see the reasoning there).
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret — skipping import; signed builds must find a valid identity or fail."
            exit 0
          fi
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"   # no auto-lock for 6h
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          # Add our keychain to the search list (prepend, keep the existing ones).
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/[",]//g')
          rm -f "$CERT_PATH"
          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # macOS: signed+notarized. An unsigned macOS release is NOT a degraded build,
      # it is a build that damages the people who install it: macOS keys privacy
      # approvals by bundle id PLUS the code requirement of whatever held them at
      # grant time, and an ad-hoc signature has no stable identity. Anyone who grants
      # Screen Recording (or notifications, …) to an ad-hoc build is left with a TCC
      # row the next properly signed release can never satisfy — tccd refuses with
      # "Failed to match existing code requirement" while the System Settings switch
      # still reads ON, and re-toggling never rewrites the requirement. That happened
      # for real (2026-08-19): the screenshot button was unusable until the row was
      # deleted by hand, and nothing in the product could tell the user why.
      #
      # So a missing signing identity FAILS the release instead of silently shipping
      # ad-hoc, which is what this step used to do. The opt-in repository variable
      # allows only workflow_dispatch verification artifacts to be unsigned.
      - name: Release build (macOS)
        id: macos_build
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            # Report which road this build actually took, so the verification step
            # keys off what happened rather than off ALLOW_UNSIGNED_RELEASE — that
            # variable being set is not a reason to stop checking a build that WAS
            # signed.
            echo "unsigned=false" >> "$GITHUB_OUTPUT"
            bun run --bun scripts/release-ci.ts
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${ALLOW_UNSIGNED_RELEASE:-}" = "true" ]; then
            echo "::warning::ALLOW_UNSIGNED_RELEASE=true — producing an AD-HOC signed verification artifact."
            echo "::warning::Anyone who grants it a privacy permission will need to remove the approval by hand before a signed build works again."
            echo "::warning::The artifact will also carry the '<identifier>.dev' bundle id (build-release.ts), deliberately: an ad-hoc build must never be able to poison the signed app's TCC rows. It is a separate app to macOS."
            echo "unsigned=true" >> "$GITHUB_OUTPUT"
            bun run --bun scripts/release-ci.ts --unsigned
          else
            echo "::error::APPLE_SIGNING_IDENTITY is empty — refusing to publish an unsigned macOS build."
            echo "::error::Fix the APPLE_* secrets. Tag releases never downgrade to unsigned."
            exit 1
          fi

      # The build above can still degrade quietly in a second way: build-release.ts
      # skips notarization with only a console warning when APPLE_ID / APPLE_PASSWORD
      # / APPLE_TEAM_ID are missing, so "signed" does not imply "notarized+stapled".
      # Assert the properties users actually depend on, against the artifact that is
      # about to be uploaded. `stapler validate` (not spctl) is the check that matters:
      # spctl can pass via an online lookup on a networked runner, while a missing
      # staple only bites the user later, offline, on first launch.
      - name: Verify macOS artifacts are signed and notarized
        if: runner.os == 'macOS' && steps.macos_build.outputs.unsigned != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT=packages/client/desktop/src-tauri/target
          if [ "$ULTRAWORK_RELEASE_BRAND" = "mywork" ]; then BUNDLE_ROOT=.brand-build/mywork/target; fi
          APPS=$(find "$BUNDLE_ROOT" -type d -path '*/release/bundle/macos/*.app' -prune)
          APP=$(echo "$APPS" | head -1)
          DMG=$(find "$BUNDLE_ROOT" -type f -path '*/release/bundle/dmg/*.dmg' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app found under $BUNDLE_ROOT — nothing to verify."
            exit 1
          fi
          # A runner builds exactly one. More than one means the target dir was reused
          # and "which artifact did I just verify" has no answer — the same trap
          # build-release.ts guards for DMGs.
          if [ "$(echo "$APPS" | wc -l)" -gt 1 ]; then
            echo "::error::Multiple .app bundles found; cannot tell which one this build produced:"
            echo "$APPS"
            exit 1
          fi
          echo "Verifying: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if ! codesign -dvvv "$APP" 2>&1 | grep -q '^Authority=Developer ID Application:'; then
            echo "::error::$APP is not signed by a Developer ID Application certificate."
            codesign -dvvv "$APP" 2>&1 | sed -n '1,20p'
            exit 1
          fi
          xcrun stapler validate "$APP"
          if [ -n "$DMG" ]; then
            echo "Verifying: $DMG"
            xcrun stapler validate "$DMG"
          else
            echo "::warning::No DMG found to validate."
          fi
          echo "Signed by Developer ID and stapled ✓"

      # tauri-bundler fetches the NSIS toolchain and — for the offline installer —
      # the ~176MB WebView2 runtime into this directory, keyed only on the file
      # existing. Caching saves the byte transfer; it does NOT avoid the
      # `WebView2 URL prefix mismatch` failure, because the bundler resolves the
      # fwlink (and runs that assertion) before the existence check every build —
      # the pre-seed hatch in discussions/030 §9.3-A is the fix for that.
      # NOTE: the key is static. The WebView2 installer is cached under a
      # version-specific GUID dir, so a new runtime redownloads correctly, but
      # actions/cache won't re-save on an exact key hit — treat WebView2 as
      # effectively uncached. The `nsis3.11` tag is decorative: bump it by hand
      # when a tauri upgrade needs a newer NSIS (see discussions/030 §9.3-A).
      - name: Cache Tauri bundler tools (NSIS toolchain)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ runner.os }}-nsis3.11-webview2

      # Windows / Linux: build-release.ts builds sidecars + `tauri build`.
      # APPIMAGE_EXTRACT_AND_RUN: linuxdeploy/appimagetool need FUSE, which GitHub
      # Actions runners lack — extract-and-run avoids FUSE (ignored on Windows).
      - name: Release build (Windows/Linux)
        if: runner.os != 'macOS'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bun run --bun scripts/release-ci.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand == 'mywork' && 'mywork' || 'ultrawork' }}-${{ matrix.name }}
          if-no-files-found: error
          include-hidden-files: true
          path: .brand-build/artifacts/${{ matrix.brand == 'mywork' && 'mywork' || 'ultrawork' }}/**/*

  # Version tags (v*) get a real GitHub Release page with every installer
  # attached. workflow_dispatch runs stay artifact-only (verification builds).
  publish:
    name: publish release page
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Preserve the distinct named artifact roots; the merge step below
          # restores exactly brand/platform, rather than flattening manifests.
          merge-multiple: false

      - name: Restore edition/platform hierarchy and validate installers
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir collected
          for archive in dist/*; do
            name="$(basename "$archive")"
            case "$name" in
              ultrawork-*) edition=ultrawork ;;
              mywork-*) edition=mywork ;;
              *) echo "::error::Unexpected artifact $name"; exit 1 ;;
            esac
            mkdir -p "collected/$edition"
            cp -R "$archive"/* "collected/$edition/"
          done
          bun run --bun scripts/release-ci.ts --verify-artifacts collected > release-assets.txt
          {
            echo 'files<<RELEASE_FILES'
            cat release-assets.txt
            echo RELEASE_FILES
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Ultrawork + MyWork ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.assets.outputs.files }}
