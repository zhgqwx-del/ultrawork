<section class="slide" data-layout="S10" data-rhythm="dense">
  <h1>规格一览</h1>
  <table style="width:100%;margin-top:48px;border-collapse:collapse;font-size:var(--fs-body)">
    <thead><tr style="border-bottom:calc(var(--rule-w) * 2) solid var(--c-primary)">
      <th style="text-align:left;padding:16px 8px;font-weight:700;color:var(--c-head)">规格项</th>
      <th style="text-align:left;padding:16px 8px;font-weight:700;color:var(--c-head)">参数</th>
    </tr></thead>
    <tbody>
      <tr style="border-bottom:var(--rule-w) solid var(--c-bg2)">
        <td style="padding:16px 8px;font-weight:500;color:var(--c-head)">亮度</td>
        <td style="padding:16px 8px;font-weight:300">500 流明</td>
      </tr>
      <tr style="border-bottom:var(--rule-w) solid var(--c-bg2)">
        <td style="padding:16px 8px;font-weight:500;color:var(--c-head)">分辨率</td>
        <td style="padding:16px 8px;font-weight:300">1080P 原生</td>
      </tr>
      <tr style="border-bottom:var(--rule-w) solid var(--c-bg2)">
        <td style="padding:16px 8px;font-weight:500;color:var(--c-head)">续航</td>
        <td style="padding:16px 8px;font-weight:300">4 小时（内置电池）</td>
      </tr>
      <tr style="border-bottom:var(--rule-w) solid var(--c-bg2)">
        <td style="padding:16px 8px;font-weight:500;color:var(--c-head)">重量</td>
        <td style="padding:16px 8px;font-weight:300">260 克</td>
      </tr>
      <tr style="border-bottom:var(--rule-w) solid var(--c-bg2)">
        <td style="padding:16px 8px;font-weight:500;color:var(--c-head)">接口</td>
        <td style="padding:16px 8px;font-weight:300">HDMI / USB-C / 无线投屏</td>
      </tr>
    </tbody>
  </table>
  <div style="position:absolute;bottom:24px;left:64px;font-size:var(--fs-caption);color:var(--c-muted)">示意数据 · 虚构产品</div>
  <div class="pagenum">6 / 7</div>
</section>
