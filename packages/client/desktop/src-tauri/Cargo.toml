[package]
name = "ultrawork"
version = "0.3.5"
description = "Desktop Agent"
authors = ["Ultrawork Team"]
edition = "2021"

[lib]
name = "ultrawork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ultrawork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# A second launch must focus the running window, not boot a rival set of sidecars
# (dynamic ports removed the accidental lock the fixed ports used to provide).
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# In-app screenshot (ADR-056): Windows `ms-screenclip:` writes ONLY to the
# clipboard (no file, no callback), so the Windows capture path reads the image
# back through this plugin and polls for a change. Cross-platform plugin; the
# clipboard read itself is only compiled on Windows (lib.rs `capture_windows`).
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
getrandom = "0.2"
base64 = "0.22"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Office CLI connector installs verify release archives against pinned sha256
# digests (mirrors the upstream npm installer's checksums.txt) before extracting.
sha2 = "0.10"

# Windows-only: the WebView2 preflight (src/webview_runtime.rs) must warn the user
# before `tauri::Builder` exists, so it cannot use tauri-plugin-dialog (needs an
# AppHandle). rfd is already in the tree as that plugin's backend — same version,
# no new transitive deps.
#
# default-features would drag in rfd's Linux story (xdg-portal → ashpd, wayland,
# async-std) for a dependency that only ever builds on Windows. The Windows
# backend needs none of it. `common-controls-v6` stays off too — hence Yes/No
# buttons rather than custom labels (see webview_runtime.rs).
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.16", default-features = false }
# In-app screenshot (ADR-056): ms-screenclip hands us a raw RGBA image off the
# clipboard; encode it to a PNG file so the Windows path returns the same "temp
# PNG path" contract as macOS/Linux. Pure-Rust, no system deps — Windows-only
# because that is the only path that reads a clipboard image.
png = "0.17"

# Unix-only: catch SIGINT/SIGTERM/SIGHUP and clean up sidecars on non-graceful
# exits that RunEvent::Exit doesn't cover. (SIGKILL is uncatchable — that path
# is handled by prepare_port's startup self-heal.) Windows has no POSIX signals;
# install_signal_handlers() is a no-op there (see lib.rs).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
