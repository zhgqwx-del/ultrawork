name: Release

# Tag-triggered installer builds for all platforms. Produces the native
# installers (macOS .dmg, Windows .msi/.exe, Linux .deb/.rpm/.AppImage) and
# uploads them as artifacts; on a version tag (v*) the publish job additionally
# creates a GitHub Release page with all installers attached. macOS
# signing/notarization activates when the APPLE_* secrets are present;
# otherwise it falls back to an unsigned build.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@stable

      # macOS builds a Universal binary (universal-apple-darwin) → needs the
      # x86_64 target too (runner host is arm64).
      - name: Add x86_64 macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libfuse2

      - name: Install dependencies
        shell: bash
        run: |
          bun install
          cd vendor/opencode && bun install

      # macOS: signed+notarized when secrets exist, unsigned otherwise.
      - name: Release build (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            bun run release
          else
            bun run release --unsigned
          fi

      # tauri-bundler fetches the NSIS toolchain and — for the offline installer —
      # the ~176MB WebView2 runtime into this directory, keyed only on the file
      # existing. Caching it saves the download and, more importantly, insulates the
      # build from `WebView2 URL prefix mismatch`: the bundler asserts Microsoft's
      # fwlink redirects to a hardcoded CDN host, which is geo-balanced.
      # See discussions/030 §9.3-A.
      - name: Cache Tauri bundler tools (NSIS + WebView2 runtime)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ runner.os }}-nsis3.11-webview2

      # Windows / Linux: build-release.ts builds sidecars + `tauri build`.
      # APPIMAGE_EXTRACT_AND_RUN: linuxdeploy/appimagetool need FUSE, which GitHub
      # Actions runners lack — extract-and-run avoids FUSE (ignored on Windows).
      - name: Release build (Windows/Linux)
        if: runner.os != 'macOS'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bun run release

      - uses: actions/upload-artifact@v4
        with:
          name: ultrawork-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.msi
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.deb
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.rpm

  # Version tags (v*) get a real GitHub Release page with every installer
  # attached. workflow_dispatch runs stay artifact-only (verification builds).
  publish:
    name: publish release page
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected installers
        run: find dist -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: Ultrawork ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*-setup.exe
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
