<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Top face gradient: cyan to light blue -->
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <!-- Left face gradient: indigo mid -->
    <linearGradient id="gl" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <!-- Right face gradient: deep indigo -->
    <linearGradient id="gr" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <!-- Top highlight: bright refraction line -->
    <linearGradient id="gref" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <!-- Background gradient: deep indigo to dark navy -->
    <linearGradient id="gbg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0C0A2A"/>
    </linearGradient>
    <!-- Ambient glow -->
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.42">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#4338CA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: deep indigo gradient rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#gbg)"/>

  <!-- Ambient glow behind crystal -->
  <ellipse cx="256" cy="265" rx="190" ry="170" fill="url(#glow)"/>

  <!-- === Crystal Prism (isometric hexagonal) === -->

  <!-- Left face -->
  <polygon points="140,182 256,252 256,402 140,332" fill="url(#gl)"/>

  <!-- Right face -->
  <polygon points="256,252 372,182 372,332 256,402" fill="url(#gr)"/>

  <!-- Top face -->
  <polygon points="256,112 372,182 256,252 140,182" fill="url(#gt)"/>

  <!-- Top face internal refraction line (divides top into two halves) -->
  <polygon points="256,112 372,182 256,252" fill="#818CF8" opacity="0.25"/>

  <!-- Edge highlights for depth -->
  <!-- Center vertical edge -->
  <line x1="256" y1="252" x2="256" y2="402" stroke="#A5B4FC" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- Top center ridge -->
  <line x1="256" y1="112" x2="256" y2="252" stroke="url(#gref)" stroke-opacity="0.5" stroke-width="2"/>
  <!-- Top left edge -->
  <line x1="256" y1="112" x2="140" y2="182" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Top right edge -->
  <line x1="256" y1="112" x2="372" y2="182" stroke="#818CF8" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Small specular highlight on top face -->
  <polygon points="220,155 256,138 280,160 256,172" fill="white" opacity="0.12"/>
</svg>
