<!-- S16 KPI 网格（anchor）：页题 + 4-6 个指标格（大数字 + 标签 + 同比说明） -->
<section class="slide" data-layout="S16" data-rhythm="anchor">
  <h1>结论句式标题</h1>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:64px">
    <div style="border-top:calc(var(--rule-w) * 2) solid var(--c-muted);padding-top:24px">
      <div class="num" style="font-size:var(--fs-num);color:var(--c-accent)">42%</div>
      <h3 style="color:var(--c-head);margin-top:16px">指标名</h3>
      <p style="margin-top:8px;color:var(--c-muted);font-size:var(--fs-caption)">同比 / 口径</p>
    </div>
  </div>
  <div style="position:absolute;bottom:40px;left:64px;font-size:var(--fs-caption);color:var(--c-muted)">数据来源 / 口径</div>
</section>
