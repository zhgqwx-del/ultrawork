name: Release

# Tag-triggered installer builds for all platforms. Produces the native
# installers (macOS .dmg, Windows .msi/.exe, Linux .deb/.AppImage) and uploads
# them as artifacts. macOS signing/notarization activates when the APPLE_*
# secrets are present; otherwise it falls back to an unsigned build.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@stable

      # macOS builds a Universal binary (universal-apple-darwin) → needs the
      # x86_64 target too (runner host is arm64).
      - name: Add x86_64 macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install dependencies
        shell: bash
        run: |
          bun install
          cd vendor/opencode && bun install

      # macOS: signed+notarized when secrets exist, unsigned otherwise.
      - name: Release build (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            bun run release
          else
            bun run release --unsigned
          fi

      # Windows / Linux: build-release.ts builds sidecars + `tauri build`.
      - name: Release build (Windows/Linux)
        if: runner.os != 'macOS'
        run: bun run release

      - uses: actions/upload-artifact@v4
        with:
          name: ultrawork-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.msi
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            packages/client/desktop/src-tauri/target/**/release/bundle/**/*.deb
