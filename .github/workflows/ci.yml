name: CI

# Cross-platform compatibility gate. Every push/PR is verified on macOS, Windows
# and Linux so a regression that only breaks one OS (hardcoded "/", $HOME,
# unix-only command, #[cfg] mistake) is caught here, not by a user.
# See docs/conventions.md §跨平台编码规范 and docs/quality-gates.md §2.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Docs: drift gate (ADR counts, broken refs/links, section refs) ─
  # Same script the wrap-up flow runs locally (scripts/check-docs.ts); here it
  # is a merge gate so a forgotten wrap-up step can't land drifted docs.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Shallow checkout is fine: the requirements-freshness check is warning-only
      # and silently skips when git history is unavailable; it runs fully at local
      # wrap-up where history exists. Not worth a full-history clone here.
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      # No `bun install` needed: the script only uses bun/node builtins.
      # --selftest first: §11's cross-skill link scan is only worth trusting if it
      # can still go red. It runs six broken-link forms — several of them verbatim
      # from defects that actually shipped (059 §1 `doc-export`) — plus five lines
      # that must NOT trip it, each one a shape that already false-positived once.
      - run: bun run --bun scripts/check-docs.ts --selftest
      - run: bun run --bun scripts/check-docs.ts

  # ── TS: typecheck + unit tests on all three OSes ──────────────────
  node:
    name: node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # fail fast if a test hangs (e.g. an unclosed handle on Windows)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install
      - name: Typecheck
        run: bun run --bun turbo run typecheck
      # zh-Hant dictionary is generated from zh-Hans at build time (ADR-058 D3).
      # Fail if someone edited the Simplified source without regenerating — runs
      # here (not the dep-free docs job) because it needs the opencc-js devDep,
      # and on all three OSes to confirm the generator is cross-platform.
      - name: zh-Hant dictionary drift guard
        run: bun run --bun scripts/gen-zh-hant.ts --check
      # Unit tests run on macOS + Linux. Skipped on Windows: several timer-heavy
      # sidecar suites (ACP idle-guard / keepalive watchdogs) leave open handles
      # that make bun/vitest hang on process exit on Windows — a test-harness
      # limitation, not a product bug (the tests themselves pass). Windows still
      # runs typecheck (above) + the full Rust suite (rust job). The TS logic under
      # test is platform-agnostic; the few process.platform branches (path-utils,
      # isBuiltinLocation) are pure functions covered on macOS/Linux. Revisit if
      # bun gains a reliable force-exit.
      # --continue: run every package's tests even if one fails, so a single run
      # surfaces all failures instead of stopping at the first.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: bun run --bun turbo run test --continue

      # The real DMG layout check needs a built DMG, so it only ever runs at
      # release time. This exercises its parser and asserts build-release.ts
      # still opts out of tauri-bundler's CI behaviour — without it, deleting
      # that opt-out is a green merge and a mislaid installer at the next tag.
      - name: DMG layout guard (self-test)
        run: bun run --bun scripts/verify-dmg-layout.ts --self-test

  # ── Rust: compile (all #[cfg] branches for the host OS) + cargo test ─
  # Office-skill gates (discussions/059). Three platforms because the skills ship to
  # all three and the whole family is pure Python driving PyMuPDF — until this job
  # existed every one of these had only ever run on one developer's macOS box, which
  # is exactly how the harness came to hardcode /System/Library/Fonts.
  #
  # L0 (clean-room originality) is NOT here: it needs the reference corpus, which is
  # deliberately outside the repo. It exits 2 = skipped when absent, and is run by
  # hand before a PR that adds skill content.
  office-skills:
    name: office skills (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Measured 2026-08-02 on the author's machine with LibreOffice present: the gate
    # steps total ~195s, of which the L2 self-test is ~116s. From 2026-08-03 all
    # three runners install LibreOffice, so every platform pays that ~195s AND a
    # several-hundred-megabyte install (brew cask / choco are far slower than apt).
    # 15 minutes was sized for "one platform installs it"; 30 is sized for three.
    timeout-minutes: 30
    env:
      # The ECMA-376 schemas are vendored (scripts/schemas/ecma376), so the `xsd`
      # tier is available everywhere. LibreOffice is now installed on ALL THREE
      # platforms (see the install step), so no runner declares a missing tier and
      # this expands to nothing everywhere — it is kept rather than deleted because
      # an empty --allow-missing is an argparse error, not a no-op, and a developer
      # reproducing this job without LibreOffice needs the hook.
      ALLOW_MISSING_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ⚠️ This list went stale the moment the pdf skill moved off PyMuPDF (059
      # §六·补三/补四) and nobody noticed, because the branch was never pushed —
      # the same shape as the recalc-drift landmine in §7. On the author's machine
      # every library is installed, so the gap was invisible there too.
      #
      #   pypdfium2 / pdfplumber / reportlab  what the pdf skill and deckcraft's
      #                                       pdf_to_md now actually stand on
      #   pillow                              deckcraft's core export path (PIL);
      #                                       pdfplumber pulls it in, named anyway
      #                                       so the reason survives a dep change
      #   pymupdf                             NOT for the skills — skills/ has zero
      #                                       fitz imports. Three GATE scripts still
      #                                       use it (office-skills-selftest,
      #                                       test-pdf-skill, test-xlsx-skill); they
      #                                       are not distributed, so AGPL does not
      #                                       reach the product. Drop this when they
      #                                       are swapped.
      #   python-docx                         S4's skill; already here for L1/L2 stubs
      #   python-pptx                         the `pptx-edit` skill (S6) — both of its
      #                                       scripts import it unconditionally, and
      #                                       its gate builds its own fixtures with it
      - name: Install the libraries the skills import
        run: >
          python -m pip install --disable-pip-version-check
          pypdf pypdfium2 pdfplumber reportlab pillow
          openpyxl lxml python-docx python-pptx pymupdf
      # LibreOffice on ALL THREE platforms (059 §7, upgraded from option B on
      # 2026-08-03 after the first CI run this branch ever had).
      #
      # Why it is not optional dressing: the L2 gate's X3 negative control
      # (recalc-drift) can only fire where a recalculation actually happens, and the
      # L1 ACCEPTANCE tier runs each capability's sample for real — W17 (docx→PDF)
      # and X13 (xlsx→PDF) call `soffice` themselves and exit 2 without it. That
      # second half is what option B could not cover: `--allow-missing soffice`
      # relaxes L2's tier check, it cannot make a script that needs LibreOffice run
      # without it. Measured on the first push: macOS and Windows both red there.
      #
      # It also closes a gap 059 §7 wrote down and left open: find_soffice()'s macOS
      # and Windows branches had never been executed anywhere. They are now.
      #
      # calc AND writer on Linux. Writer is not S4 scope creep — the L2 gate's D7
      # converts a .docx to PDF on EVERY docx case, and with calc alone the binary
      # exists, exits 0 on a .docx and writes no file.
      #
      # ⚠️ TWO CJK font packages, and they are not redundant — they serve two
      # consumers with incompatible requirements. The runner image ships neither.
      #
      #   fonts-noto-cjk    for LIBREOFFICE. Without it D7's tofu detector fires:
      #                     measured, "only 10% of 72 CJK glyphs have interior
      #                     strokes (need 50%)", four cases red.
      #   fonts-wqy-zenhei  for REPORTLAB, which the pdf skill writes with.
      #                     Noto Sans CJK has CFF/PostScript outlines and reportlab
      #                     cannot embed those (gotchas §21.1 ⑯) — measured, with
      #                     61 MB of Noto installed the skill still reported "no CJK
      #                     font on this machine" and P7/P8/P13/P14 refused to run.
      #                     wqy-zenhei is TrueType and lands on the exact path
      #                     pdffont.py already probes.
      #
      # macOS and Windows ship CJK faces of their own, so this is a Linux-only need.
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-writer fonts-noto-cjk fonts-wqy-zenhei
      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh --no-progress -y
      # find_soffice() probes PATH and the per-platform install locations. Proving it
      # resolves BEFORE the gates run means a failure below is about the code, not
      # about an installer that quietly did nothing — `soffice` is a launcher that
      # exits 0 on inputs it silently refuses (gotchas §21 ⑧/㉖).
      - name: Prove LibreOffice is reachable on this platform
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location(
              "l2", pathlib.Path("scripts/office-skills-selftest.py"))
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          found = m.find_soffice()
          print(f"find_soffice() -> {found!r}")
          sys.exit(0 if found else 1)
          PY
      # shell: bash on every gate step below — the default on Windows is pwsh, where
      # $ALLOW_MISSING silently expands to nothing instead of the env var, which
      # would quietly turn the strict tier back on and go red for the wrong reason.
      - name: L2 artifact gate (self-test)
        shell: bash
        run: python scripts/office-skills-selftest.py $ALLOW_MISSING_FLAG
      - name: L1 capability gate (self-test)
        run: python scripts/check-office-skill-capabilities.py --selftest
      # Scoped to the skills that have finished. An unscoped --no-pending goes red
      # the moment the next skill starts its first slice (059 §6 builds one at a
      # time), and a job that is red by design is a job nobody reads. Add each skill
      # here as it clears its debt: pdf did in S2, xlsx in S3, docx in S4 — its last
      # two capabilities (W18 diff, W19 table presets) landed together and its
      # `pending` block is now empty. This line IS S4's acceptance judgement: the
      # skill is done when the gate says so, not when it feels done.
      - name: L1 capability gate (acceptance tier, no pending debt)
        shell: bash
        run: python scripts/check-office-skill-capabilities.py --no-pending pdf xlsx docx $ALLOW_MISSING_FLAG
      - name: pdf skill behaviour tests
        run: python scripts/test-pdf-skill.py
      - name: xlsx skill behaviour tests
        run: python scripts/test-xlsx-skill.py
      # Added in the same slice that created the gate, deliberately: "a gate that
      # only ever runs on the author's machine" is how the last two rounds each
      # shipped defects that reproduced nowhere else.
      - name: docx skill behaviour tests
        run: python scripts/test-docx-skill.py
      # deckcraft's pdf_to_md, which S3.5 moved off PyMuPDF. Its fixtures are built
      # into a temp dir at run time (reportlab/pypdf), so this needs no committed
      # corpus beyond the example deck already in the tree. Listed here because a
      # gate that only ever runs on the author's machine is how the last round
      # shipped two defects that only reproduced on someone else's.
      - name: deckcraft pdf_to_md behaviour tests
        run: python scripts/test-deckcraft-pdf-md.py
      # pptx-edit (the skill formerly named doc-edit). Half of it guards two crash
      # fixes the S6 wrap-up review found — a .pptx written by a minimal OOXML
      # generator, with no slideLayout and no slideMaster, made BOTH scripts die
      # with a bare traceback. The other half asserts the LIMITS SKILL.md claims
      # (table/group text invisible, cross-run phrases unmatched), in both
      # directions, so those claims cannot silently rot.
      - name: pptx-edit skill behaviour tests
        run: python scripts/test-pptx-edit-skill.py
      # The evaluator's coverage boundary. Its LibreOffice half is skipped here and
      # named out loud; the pinned values themselves are still checked against the
      # python engine on every platform.
      - name: xlsx formula evaluator calibration
        run: python scripts/xlsx-evaluator-calibration.py

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25 # Windows Rust compile (deps + winres) runs ~9min; guard hangs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/client/desktop/src-tauri
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # lsof: listening_pids_on_port uses it on unix. ubuntu-latest ships it
          # today, but the port-lifecycle tests must not rest on the image's whim.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev lsof
      - run: bun install
      # tauri::generate_context! embeds the built frontend at compile time.
      - name: Build frontend
        run: bun run --bun turbo run build --filter=@agent/client-desktop
      # Placeholder sidecar binaries so config resolution succeeds — cargo test
      # never executes them, and the real binaries are produced by release.yml.
      - name: Stub sidecar binaries
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p packages/client/desktop/src-tauri/binaries
          for b in opencode-server channel-gateway knowledge-sidecar acp-client; do
            touch "packages/client/desktop/src-tauri/binaries/${b}-${TRIPLE}${EXT}"
          done
      - name: cargo test (compiles + runs Rust unit tests)
        working-directory: packages/client/desktop/src-tauri
        run: cargo test
