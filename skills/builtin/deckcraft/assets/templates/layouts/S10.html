<!-- S10 简表（dense）：页题 + 结构化表格（表头 primary、行分隔细线、≤5 行 ≤4 列；数字右对齐 tabular） -->
<section class="slide" data-layout="S10" data-rhythm="dense">
  <h1>页标题</h1>
  <table style="width:100%;margin-top:48px;border-collapse:collapse;font-size:var(--fs-body)">
    <thead><tr style="border-bottom:calc(var(--rule-w) * 2) solid var(--c-primary)">
      <th style="text-align:left;padding:16px 8px;font-weight:700;color:var(--c-head)">列头</th>
      <th style="text-align:right;padding:16px 8px;font-weight:700;color:var(--c-head)">数值列</th>
    </tr></thead>
    <tbody><tr style="border-bottom:var(--rule-w) solid var(--c-bg2)">
      <td style="padding:16px 8px;font-weight:300">行项</td>
      <td style="padding:16px 8px;text-align:right;font-variant-numeric:tabular-nums">123</td>
    </tr></tbody>
  </table>
</section>
