<!-- S04 两栏（dense）：页题 + 左右两栏（各带栏头），并列或对比；推荐栏可加 accent 顶线 + 徽标 -->
<section class="slide" data-layout="S04" data-rhythm="dense">
  <h1>页标题</h1>
  <div style="display:flex;gap:48px;margin-top:48px;min-height:432px">
    <div style="flex:1;background:var(--c-bg2);padding:40px;border-radius:var(--radius)">
      <div class="kicker">GROUP A</div>
      <h2 style="color:var(--c-head);margin-top:8px">栏头 A</h2>
      <ul style="margin-top:24px;display:flex;flex-direction:column;gap:16px"><li>要点</li></ul>
    </div>
    <div style="flex:1;background:var(--c-bg2);padding:40px;border-top:4px solid var(--c-accent);border-radius:var(--radius)">
      <div class="kicker">GROUP B</div>
      <h2 style="color:var(--c-head);margin-top:8px">栏头 B</h2>
      <ul style="margin-top:24px;display:flex;flex-direction:column;gap:16px"><li>要点</li></ul>
    </div>
  </div>
</section>
