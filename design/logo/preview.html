<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Ultrawork Logo Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }
    h1 { font-size: 24px; font-weight: 600; }
    h2 { font-size: 16px; font-weight: 500; color: #999; margin-bottom: 16px; }
    .section { text-align: center; }
    .row {
      display: flex;
      gap: 40px;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }
    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .item span { font-size: 12px; color: #888; }
    .light-bg {
      background: #f1f5f9;
      border-radius: 16px;
      padding: 24px;
    }
    img { display: block; }
  </style>
</head>
<body>
  <h1>Ultrawork Logo — Ultra Prism</h1>

  <!-- App Icon -->
  <div class="section">
    <h2>App Icon (icon-app.svg) — 深色背景</h2>
    <div class="row">
      <div class="item">
        <img src="icon-app.svg" width="256" height="256">
        <span>256px</span>
      </div>
      <div class="item">
        <img src="icon-app.svg" width="128" height="128">
        <span>128px</span>
      </div>
      <div class="item">
        <img src="icon-app.svg" width="64" height="64">
        <span>64px</span>
      </div>
      <div class="item">
        <img src="icon-app.svg" width="32" height="32">
        <span>32px</span>
      </div>
      <div class="item">
        <img src="icon-app.svg" width="16" height="16">
        <span>16px</span>
      </div>
    </div>
  </div>

  <!-- Logo Mark on dark -->
  <div class="section">
    <h2>Logo Mark (logo-mark.svg) — 深色背景上</h2>
    <div class="row">
      <div class="item">
        <img src="logo-mark.svg" width="200" height="180">
        <span>200px</span>
      </div>
      <div class="item">
        <img src="logo-mark.svg" width="80" height="72">
        <span>80px</span>
      </div>
      <div class="item">
        <img src="logo-mark.svg" width="40" height="36">
        <span>40px</span>
      </div>
    </div>
  </div>

  <!-- Logo Mark on light -->
  <div class="section">
    <h2>Logo Mark — 浅色背景上</h2>
    <div class="row light-bg">
      <div class="item">
        <img src="logo-mark.svg" width="200" height="180">
        <span style="color:#666">200px</span>
      </div>
      <div class="item">
        <img src="logo-mark.svg" width="80" height="72">
        <span style="color:#666">80px</span>
      </div>
      <div class="item">
        <img src="logo-mark.svg" width="40" height="36">
        <span style="color:#666">40px</span>
      </div>
    </div>
  </div>

  <!-- Simulated Dock -->
  <div class="section">
    <h2>模拟 macOS Dock 效果</h2>
    <div class="row" style="background: rgba(255,255,255,0.08); padding: 12px 24px; border-radius: 16px; gap: 16px;">
      <div style="width:48px;height:48px;border-radius:12px;background:#333;"></div>
      <img src="icon-app.svg" width="48" height="48" style="border-radius:12px;">
      <div style="width:48px;height:48px;border-radius:12px;background:#333;"></div>
      <div style="width:48px;height:48px;border-radius:12px;background:#333;"></div>
    </div>
  </div>
</body>
</html>
