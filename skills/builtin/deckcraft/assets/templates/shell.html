<!DOCTYPE html>
<!-- deckcraft shell — build_deck.py 装配最终 deck.html：
     TITLE 占位 ← outline.title · TOKENS 占位 ← tokens.css · SLIDES 占位 ← pages/*.html 按序拼接
     （占位符本体不能出现在本注释里——build 的全局替换会把内容塞进注释） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
/* ==== tokens（来自 spec_lock，唯一 HEX 来源） ==== */
{{TOKENS}}
/* ==== 结构层（风格无关，禁止手改） ==== */
*{margin:0;padding:0;box-sizing:border-box;font-synthesis:none}
html,body{background:#3a3a3a}
body{font-family:var(--font-stack);color:var(--c-text)}
.stage{width:1280px;margin:0}
.slide{width:1280px;height:720px;background:var(--c-bg);overflow:hidden;position:relative;padding:64px;margin:24px 0;line-break:strict}
.slide[data-dark]{background:var(--c-primary);color:var(--c-on-dark)}
.kicker{font-size:var(--fs-caption);letter-spacing:.25em;color:var(--c-muted);text-transform:uppercase;font-weight:500}
.pagenum{position:absolute;bottom:24px;right:32px;font-size:var(--fs-caption);color:var(--c-muted)}
h1{font-size:var(--fs-h1);font-weight:700;line-height:1.25}
h2{font-size:var(--fs-h2);font-weight:700;line-height:1.3}
h3{font-size:var(--fs-h3);font-weight:500;line-height:1.35}
p,li{font-size:var(--fs-body);font-weight:300;line-height:1.65;max-width:36em}
.accent{color:var(--c-accent);font-weight:700}
.num{font-size:var(--fs-num);font-weight:700;line-height:1;letter-spacing:-.02em}
.bar{width:48px;height:8px;background:var(--c-accent)}
ul{list-style:none}
/* ==== 打印/PDF：每页一张，精确 1280×720 ==== */
@page{size:1280px 720px;margin:0}
@media print{
  html,body{background:none}
  .slide{margin:0;page-break-after:always;break-after:page}
  .slide:last-child{page-break-after:auto;break-after:auto}
  /* !important 压过屏幕适配脚本写下的 inline transform/margin——否则 headless
     print-to-pdf（默认 800px 视口先跑了 fit()）会把整份 PDF 缩到 ~60% 并错位 */
  #stage{transform:none!important;margin-bottom:0!important}
}
</style>
</head>
<body>
<div class="stage" id="stage">
{{SLIDES}}
</div>
<script>
/* 屏幕预览：整体缩放适配窗口宽度。打印路径由 @media print 的 !important 规则
   压制（inline style 打不过 stylesheet !important），PDF 始终原尺寸。 */
(function(){
  var st = document.getElementById("stage");
  var h = 0; // scrollHeight 在加载后是常量（transform 不参与布局），缓存避免 resize 反复强制 reflow
  function fit(){
    if (!h) h = st.scrollHeight;
    var vw = document.documentElement.clientWidth;
    var s = Math.min(1, (vw - 32) / 1280);
    // Center the SCALED stage in the viewport. transform-origin:top center pins
    // the stage box's own center (x=640), which only equals the viewport center
    // at vw>=1280 — below that the stage overflows and the deck drifts right.
    // top-left + translateX((vw-1280*s)/2) centers correctly at ANY width (e.g.
    // a half-width in-app preview panel), matching margin:0 auto at vw>=1280.
    st.style.transformOrigin = "top left";
    st.style.transform = "translateX(" + ((vw - 1280 * s) / 2) + "px) scale(" + s + ")";
    st.style.marginBottom = (-(1 - s) * h) + "px";
  }
  var pending = 0;
  window.addEventListener("resize", function(){
    if (pending) return;
    pending = requestAnimationFrame(function(){ pending = 0; fit(); });
  });
  fit();
})();
</script>
</body>
</html>
