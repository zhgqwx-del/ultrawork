<!-- S17 全幅图叠字（anchor，深色底，**需素材**）：整幅图 + 底部叠一句主张；无真图时整页退化为纯色深底 -->
<section class="slide" data-layout="S17" data-rhythm="anchor" data-dark>
  <img src="images/hero.jpg" alt="主视觉描述" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <div style="position:absolute;inset:0;background:var(--c-primary);opacity:.72"></div>
  <div style="position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%">
    <div class="bar"></div>
    <h1 style="font-size:var(--fs-display);color:var(--c-on-dark);margin-top:24px;line-height:1.2">一句主张</h1>
    <p style="margin-top:24px;color:var(--c-on-dark)">一句补充</p>
  </div>
  <div style="position:absolute;bottom:24px;right:64px;font-size:var(--fs-caption);color:var(--c-on-dark)">图片来源 / credit</div>
</section>
