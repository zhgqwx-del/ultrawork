<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <defs>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="gl" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="gr" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="gref" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Crystal Prism — transparent background version -->

  <!-- Left face -->
  <polygon points="84,100 200,170 200,320 84,250" fill="url(#gl)"/>

  <!-- Right face -->
  <polygon points="200,170 316,100 316,250 200,320" fill="url(#gr)"/>

  <!-- Top face -->
  <polygon points="200,30 316,100 200,170 84,100" fill="url(#gt)"/>

  <!-- Top face refraction -->
  <polygon points="200,30 316,100 200,170" fill="#818CF8" opacity="0.25"/>

  <!-- Edge highlights -->
  <line x1="200" y1="170" x2="200" y2="320" stroke="#A5B4FC" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="200" y1="30" x2="200" y2="170" stroke="url(#gref)" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="200" y1="30" x2="84" y2="100" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="200" y1="30" x2="316" y2="100" stroke="#818CF8" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Specular highlight -->
  <polygon points="168,73 200,56 224,78 200,90" fill="white" opacity="0.12"/>
</svg>
