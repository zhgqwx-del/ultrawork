<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultrawork</title>

    <!--
      Resolve the theme before the first paint (discussions/038).

      ThemeProvider only adds the `light`/`dark` class from a `useEffect`, and its
      `resolvedTheme` starts as a hardcoded "light" — so a dark-mode user was shown a
      light frame first, every launch. This runs before the body exists and reads the
      same key ConfigStorage persists to, so React's later pass agrees with it rather
      than correcting it.
    -->
    <script>
      ;(function () {
        var theme = "system"
        try {
          var raw = localStorage.getItem("ultrawork-config")
          if (raw) {
            var stored = JSON.parse(raw).theme
            if (stored === "light" || stored === "dark" || stored === "system") theme = stored
          }
        } catch (e) {
          /* unreadable config — fall back to the system preference */
        }
        var dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
        document.documentElement.style.setProperty("--boot-bg", dark ? "#232327" : "#fafafb")
        document.documentElement.style.setProperty("--boot-fg", dark ? "#a1a1aa" : "#71717a")
        document.documentElement.style.setProperty("--boot-track", dark ? "#34343a" : "#ececee")

        // Same language resolution as ConfigStorage: the persisted choice, else the
        // system locale. The app is English by default outside zh, and the splash is
        // up for the whole of the slowest launch — it must not be the one screen that
        // is always Chinese.
        var zh = "zh"
        try {
          var lang = raw && JSON.parse(raw).language
          if (lang !== "zh" && lang !== "en") lang = null
          zh = (lang || navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en"
        } catch (e) {
          zh = "en"
        }
        document.documentElement.setAttribute("data-boot-lang", zh)
      })()
    </script>

    <style>
      /*
        Inline on purpose: the splash has to paint as early as the webview can manage,
        and it must not depend on the bundle (which is what takes the time). The
        stylesheet in this same head is still render-blocking in a production build, but
        it is a local asset-protocol read of a few ms, not a network fetch.

        `top/right/bottom/left` rather than `inset`, and margins rather than flex `gap`:
        both shorthands need a fairly recent engine, and this is the one layer that has
        to hold up when nothing else has loaded. A splash that fails to cover the window
        is worse than no splash.
      */
      #boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg, #fafafb);
        color: var(--boot-fg, #71717a);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        opacity: 1;
        transition: opacity 220ms ease;
      }
      #boot-splash-bar {
        position: relative;
        width: 180px;
        height: 2px;
        margin-bottom: 18px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--boot-track, #ececee);
      }
      /*
        Indeterminate, not a percentage. The genuinely slow launch is the first one
        after an install, and its duration is not knowable up front — a bar stalled at
        90% reads worse than one that simply says it is still working.
      */
      #boot-splash-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: currentColor;
        opacity: 0.55;
        animation: boot-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash-bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!--
      `data-tauri-drag-region` because the macOS window uses an overlay title bar:
      without it the window could not be moved while the splash is up. Tauri injects the
      drag script on all three platforms and only honours the attribute on the elements
      that carry it, so the children need it too — otherwise the window cannot be
      dragged by the one part of the splash that is actually visible.
    -->
    <div id="boot-splash" data-tauri-drag-region>
      <div id="boot-splash-bar" data-tauri-drag-region></div>
      <div id="boot-splash-stage" data-tauri-drag-region></div>
    </div>
    <div id="root"></div>

    <!-- First line, before the bundle exists to say anything. -->
    <script>
      document.getElementById("boot-splash-stage").textContent =
        document.documentElement.getAttribute("data-boot-lang") === "zh"
          ? "正在启动…"
          : "Starting…"
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
