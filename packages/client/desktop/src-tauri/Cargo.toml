[package]
name = "ultrawork"
version = "0.1.0"
description = "Desktop Agent"
authors = ["Ultrawork Team"]
edition = "2021"

[lib]
name = "ultrawork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ultrawork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
getrandom = "0.2"
base64 = "0.22"
# Already resolved transitively (via tauri); used directly to catch
# SIGINT/SIGTERM/SIGHUP and clean up sidecars on non-graceful exits that
# RunEvent::Exit doesn't cover. (SIGKILL is uncatchable — that path is
# handled by prepare_port's startup self-heal.)
signal-hook = "0.3"
