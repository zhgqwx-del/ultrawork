<!-- S13 2×2 矩阵（dense）：页题 + 两轴标签 + 四象限（各带象限名与一句判断） -->
<section class="slide" data-layout="S13" data-rhythm="dense">
  <h1>页标题</h1>
  <div style="display:flex;gap:24px;margin-top:40px;align-items:center">
    <div class="kicker" style="writing-mode:vertical-rl;transform:rotate(180deg)">纵轴标签</div>
    <div style="flex:1">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div style="background:var(--c-bg2);padding:24px;border-radius:var(--radius);min-height:176px">
          <h3 style="color:var(--c-head)">象限名</h3><p style="margin-top:8px;color:var(--c-muted);font-size:var(--fs-caption)">一句判断</p>
        </div>
      </div>
      <div class="kicker" style="margin-top:16px;text-align:center">横轴标签</div>
    </div>
  </div>
</section>
